<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Foodiecious</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark bg-black text-white p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-bold tracking-tighter uppercase font-heading italic text-primary">Foodiecious <span class="text-foreground">Dashboard</span></h1>
            <button id="logout" class="px-4 py-2 border border-zinc-700 hover:bg-zinc-800 rounded-lg transition-colors">
                Logout
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 bg-zinc-900/50 backdrop-blur-xl border border-zinc-800 rounded-2xl">
                <h2 class="text-xl font-semibold mb-4">Settings</h2>
                <form id="update-password-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1">Current Password</label>
                        <input type="password" id="current-password" class="w-full px-4 py-2 bg-black border border-zinc-700 rounded-lg focus:outline-none focus:border-blue-500 transition-colors mb-4" required>
                        <label class="block text-sm font-medium text-zinc-400 mb-1">New Password</label>
                        <input type="password" id="new-password" class="w-full px-4 py-2 bg-black border border-zinc-700 rounded-lg focus:outline-none focus:border-blue-500 transition-colors" required>
                    </div>
                    <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
                        Save Password
                    </button>
                    <p id="message" class="text-sm hidden"></p>
                </form>
            </div>

            <div class="p-6 bg-zinc-900/50 backdrop-blur-xl border border-zinc-800 rounded-2xl">
                <h2 class="text-xl font-semibold mb-4">Quick Stats</h2>
                <div class="space-y-2 text-zinc-400">
                    <p>Total Reservations: <span class="text-white">0</span></p>
                    <p>Menu Items: <span class="text-white">5</span></p>
                    <p>Website Visits: <span class="text-white">1,240</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }

        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('isAdmin');
            window.location.href = 'login.html';
        });

        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const message = document.getElementById('message');

            const res = await fetch('../api/admin/update-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword })
            });

            message.classList.remove('hidden');
            if (res.ok) {
                message.textContent = 'Password updated successfully!';
                message.className = 'text-sm text-blue-400';
                e.target.reset();
            } else {
                message.textContent = 'Failed to update password.';
                message.className = 'text-sm text-red-500';
            }
        });
    </script>
</body>
</html>
